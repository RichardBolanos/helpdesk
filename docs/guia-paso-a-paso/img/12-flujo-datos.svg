<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="480" viewBox="0 0 960 480" role="img">
  <title>Crear un ticket, de punta a punta: siete pasos desde el clic del usuario hasta que la fila aparece en la tabla</title>
  <style>
    text { font-family: Segoe UI, Helvetica, Arial, sans-serif; font-size: 15px; fill: #0f172a; }
    .ttl { font-size: 24px; font-weight: 700; }
    .bd { font-weight: 700; }
    .n { font-size: 13px; fill: #475569; }
    .c { font-family: Consolas, Menlo, monospace; font-size: 14px; }
    .m { text-anchor: middle; }
    .num { font-size: 13px; font-weight: 700; fill: #ffffff; text-anchor: middle; }
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
    .sep { stroke: #cbd5e1; stroke-width: 1; }
  </style>
  <defs>
    <marker id="aDark" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
  </defs>

  <rect x="0.5" y="0.5" width="959" height="479" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="46" class="ttl">Crear un ticket, de punta a punta</text>

  <!-- Bandas -->
  <rect x="242" y="62" width="690" height="146" rx="10" fill="#dbeafe" fill-opacity="0.45" stroke="#2563eb" stroke-opacity="0.35" stroke-width="1"/>
  <text x="256" y="82" class="n bd" style="fill:#2563eb">Frontend (Angular)</text>
  <rect x="708" y="232" width="224" height="146" rx="10" fill="#dcfce7" fill-opacity="0.6" stroke="#16a34a" stroke-opacity="0.35" stroke-width="1"/>
  <text x="722" y="252" class="n bd" style="fill:#16a34a">Backend</text>

  <!-- Fila superior -->
  <rect x="40" y="94" width="180" height="100" rx="10" class="box"/>
  <circle cx="60" cy="114" r="11" fill="#2563eb"/><text x="60" y="119" class="num">1</text>
  <text x="78" y="119" class="bd">Usuario</text>
  <line x1="40" y1="132" x2="220" y2="132" class="sep"/>
  <text x="54" y="168">oprime <tspan class="bd">Crear ticket</tspan></text>

  <rect x="254" y="94" width="230" height="100" rx="10" class="box"/>
  <circle cx="274" cy="114" r="11" fill="#2563eb"/><text x="274" y="119" class="num">2</text>
  <text x="292" y="119" class="bd">Componente Tickets</text>
  <line x1="254" y1="132" x2="484" y2="132" class="sep"/>
  <text x="268" y="168" class="c">api.createTicket(datos)</text>

  <rect x="517" y="94" width="190" height="100" rx="10" class="box"/>
  <circle cx="537" cy="114" r="11" fill="#2563eb"/><text x="537" y="119" class="num">3</text>
  <text x="555" y="119" class="bd">ApiService</text>
  <line x1="517" y1="132" x2="707" y2="132" class="sep"/>
  <text x="531" y="168" class="c">POST /api/tickets</text>

  <rect x="740" y="94" width="180" height="100" rx="10" class="box"/>
  <circle cx="760" cy="114" r="11" fill="#2563eb"/><text x="760" y="119" class="num">4</text>
  <text x="778" y="119" class="bd">Interceptor</text>
  <line x1="740" y1="132" x2="920" y2="132" class="sep"/>
  <text x="754" y="168">agrega el token</text>

  <line x1="222" y1="144" x2="252" y2="144" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>
  <line x1="486" y1="144" x2="515" y2="144" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>
  <line x1="709" y1="144" x2="738" y2="144" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>
  <line x1="830" y1="196" x2="830" y2="262" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>

  <!-- Fila inferior (derecha a izquierda) -->
  <rect x="720" y="264" width="200" height="100" rx="10" class="box"/>
  <circle cx="740" cy="284" r="11" fill="#2563eb"/><text x="740" y="289" class="num">5</text>
  <text x="758" y="289" class="bd">FastAPI</text>
  <line x1="720" y1="302" x2="920" y2="302" class="sep"/>
  <text x="734" y="326">valida, guarda y pone</text>
  <text x="734" y="348">id, fecha y autor</text>

  <rect x="455" y="264" width="210" height="100" rx="10" class="box"/>
  <circle cx="475" cy="284" r="11" fill="#2563eb"/><text x="475" y="289" class="num">6</text>
  <text x="493" y="289" class="bd">Respuesta</text>
  <line x1="455" y1="302" x2="665" y2="302" class="sep"/>
  <text x="469" y="338" class="c">201 + ticket completo</text>

  <rect x="40" y="264" width="360" height="100" rx="10" class="box"/>
  <circle cx="60" cy="284" r="11" fill="#2563eb"/><text x="60" y="289" class="num">7</text>
  <text x="78" y="289" class="bd">Componente Tickets</text>
  <line x1="40" y1="302" x2="400" y2="302" class="sep"/>
  <text x="54" y="326" class="c">tickets.update((list) =&gt; [t, ...list])</text>
  <text x="54" y="348">la fila aparece en la tabla</text>

  <line x1="718" y1="314" x2="667" y2="314" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>
  <line x1="453" y1="314" x2="402" y2="314" stroke="#1e293b" stroke-width="2" marker-end="url(#aDark)"/>

  <!-- Nota -->
  <rect x="40" y="396" width="880" height="60" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="56" y="421"><tspan class="bd">El servidor es la fuente de verdad:</tspan> la lista se actualiza con lo que respondió,</text>
  <text x="56" y="443">no con lo que escribió el usuario.</text>
</svg>
