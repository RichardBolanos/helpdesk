<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="544" viewBox="0 0 960 544" role="img">
  <title>Cómo se conectan la clase y la plantilla: interpolación, propiedad, evento y doble vía, y el ciclo de actualización de una señal</title>
  <style>
    .ti{font:bold 24px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .b{font:15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .bb{font:bold 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#0f172a}
    .n{font:13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#475569}
    .c{font:14px Consolas,Menlo,monospace;fill:#0f172a}
    .k{font:bold 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffffff;text-anchor:middle}
    .m{text-anchor:middle}
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2563eb"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/></marker>
    <marker id="ay" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a16207"/></marker>
    <marker id="ad" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1e293b"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="543" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="32" y="46" class="ti">Cómo se conectan la clase y la plantilla</text>

  <!-- Clase -->
  <rect x="32" y="76" width="250" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="104" class="bb">Clase · tickets.ts</text>
  <rect x="44" y="118" width="226" height="148" rx="8" fill="#f1f5f9"/>
  <text x="56" y="148" class="c">tickets = signal([...])</text>
  <text x="56" y="180" class="c">loading = signal(false)</text>
  <text x="56" y="212" class="c">title = ''</text>
  <text x="56" y="244" class="c">remove(t) { ... }</text>
  <text x="48" y="300" class="n">TypeScript: datos y métodos</text>

  <!-- Plantilla -->
  <rect x="678" y="76" width="250" height="290" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="694" y="104" class="bb">Plantilla · tickets.html</text>
  <rect x="690" y="118" width="226" height="148" rx="8" fill="#f1f5f9"/>
  <text x="702" y="148" class="c">&lt;table&gt;</text>
  <text x="702" y="180" class="c">&lt;td&gt;...&lt;/td&gt;</text>
  <text x="702" y="212" class="c">&lt;button&gt;...&lt;/button&gt;</text>
  <text x="702" y="244" class="c">&lt;input /&gt;</text>
  <text x="694" y="300" class="n">HTML: lo que ve el usuario</text>

  <!-- 1 interpolación -->
  <text x="480" y="120" class="c m">{{ t.title }}</text>
  <line x1="296" y1="132" x2="664" y2="132" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="152" class="n m">interpolación: muestra un valor</text>
  <!-- 2 propiedad -->
  <text x="480" y="184" class="c m">[disabled]="loading()"</text>
  <line x1="296" y1="196" x2="664" y2="196" stroke="#2563eb" stroke-width="2" marker-end="url(#ab)"/>
  <text x="480" y="216" class="n m">propiedad: clase → elemento</text>
  <!-- 3 evento -->
  <text x="480" y="248" class="c m">(click)="remove(t)"</text>
  <line x1="664" y1="260" x2="296" y2="260" stroke="#16a34a" stroke-width="2" marker-end="url(#ag)"/>
  <text x="480" y="280" class="n m">evento: elemento → clase</text>
  <!-- 4 doble vía -->
  <text x="480" y="312" class="c m">[(ngModel)]="title"</text>
  <line x1="298" y1="324" x2="662" y2="324" stroke="#a16207" stroke-width="2" marker-start="url(#ay)" marker-end="url(#ay)"/>
  <text x="480" y="344" class="n m">doble vía: formulario</text>

  <!-- Ciclo de la señal -->
  <rect x="32" y="388" width="896" height="132" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="48" y="414" class="bb">Cuando cambia una señal</text>

  <rect x="48" y="428" width="384" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="240" y="469" class="c m">tickets.update((list) =&gt; [nuevo, ...list])</text>
  <circle cx="66" cy="428" r="11" fill="#2563eb"/><text x="66" y="432.5" class="k">1</text>

  <line x1="434" y1="464" x2="476" y2="464" stroke="#1e293b" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="480" y="428" width="184" height="72" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text x="572" y="460" class="b m">la señal recibe</text>
  <text x="572" y="481" class="b m">una lista nueva</text>
  <circle cx="498" cy="428" r="11" fill="#2563eb"/><text x="498" y="432.5" class="k">2</text>

  <line x1="666" y1="464" x2="708" y2="464" stroke="#1e293b" stroke-width="2" marker-end="url(#ad)"/>

  <rect x="712" y="428" width="200" height="72" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text x="812" y="460" class="b m">Angular redibuja solo</text>
  <text x="812" y="481" class="b m">lo que usa tickets()</text>
  <circle cx="730" cy="428" r="11" fill="#16a34a"/><text x="730" y="432.5" class="k">3</text>
</svg>
