<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="576" viewBox="0 0 960 576" role="img">
  <title>¿Quién eres? ¿Puedes hacerlo? Diagrama de flujo de autenticación (401) y autorización (403) de una petición</title>
  <style>
    .s { font-family: Segoe UI, Helvetica, Arial, sans-serif; }
    .m { font-family: Consolas, Menlo, monospace; }
  </style>
  <defs>
    <marker id="arrDark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1e293b"/></marker>
    <marker id="arrYellow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#a16207"/></marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/></marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/></marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="575" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text class="s" x="32" y="46" font-size="24" font-weight="bold" fill="#0f172a">¿Quién eres? ¿Puedes hacerlo?</text>

  <!-- Bands -->
  <rect x="32" y="132" width="244" height="228" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
  <text class="s" x="154" y="226" font-size="15" font-weight="bold" text-anchor="middle" fill="#2563eb">Autenticación</text>
  <text class="m" x="154" y="248" font-size="14" text-anchor="middle" fill="#0f172a">get_current_user</text>
  <text class="s" x="154" y="272" font-size="13" text-anchor="middle" fill="#475569">401: no sé quién eres</text>

  <rect x="32" y="388" width="244" height="76" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="s" x="154" y="412" font-size="15" font-weight="bold" text-anchor="middle" fill="#dc2626">Autorización</text>
  <text class="m" x="154" y="432" font-size="14" text-anchor="middle" fill="#0f172a">require_roles</text>
  <text class="s" x="154" y="453" font-size="13" text-anchor="middle" fill="#475569">403: sé quién eres y no puedes</text>

  <!-- Brackets joining bands to decisions -->
  <path d="M282 140 H290 V352 H282" fill="none" stroke="#2563eb" stroke-width="1.5"/>
  <path d="M282 400 H290 V452 H282" fill="none" stroke="#dc2626" stroke-width="1.5"/>

  <!-- Start -->
  <rect x="380" y="72" width="240" height="40" rx="20" fill="#1e293b" stroke="#1e293b" stroke-width="1.5"/>
  <text class="s" x="500" y="97" font-size="15" font-weight="bold" text-anchor="middle" fill="#ffffff">Llega una petición</text>
  <line x1="500" y1="112" x2="500" y2="138" stroke="#1e293b" stroke-width="2" marker-end="url(#arrDark)"/>

  <!-- Q1 -->
  <rect x="300" y="140" width="400" height="52" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <text class="s" x="500" y="171" font-size="15" text-anchor="middle" fill="#0f172a">¿Trae la cabecera Authorization: Bearer?</text>
  <line x1="500" y1="192" x2="500" y2="218" stroke="#1e293b" stroke-width="2" marker-end="url(#arrDark)"/>
  <text class="s" x="510" y="210" font-size="13" fill="#475569">sí</text>

  <!-- Q2 -->
  <rect x="300" y="220" width="400" height="52" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <text class="s" x="500" y="251" font-size="15" text-anchor="middle" fill="#0f172a">¿La firma es válida y el token no ha vencido?</text>
  <line x1="500" y1="272" x2="500" y2="298" stroke="#1e293b" stroke-width="2" marker-end="url(#arrDark)"/>
  <text class="s" x="510" y="290" font-size="13" fill="#475569">sí</text>

  <!-- Q3 -->
  <rect x="300" y="300" width="400" height="52" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <text class="s" x="500" y="331" font-size="15" text-anchor="middle" fill="#0f172a">¿El usuario existe y está activo?</text>
  <line x1="500" y1="352" x2="500" y2="398" stroke="#1e293b" stroke-width="2" marker-end="url(#arrDark)"/>
  <text class="s" x="510" y="380" font-size="13" fill="#475569">sí</text>

  <!-- Q4 -->
  <rect x="300" y="400" width="400" height="52" rx="10" fill="#f1f5f9" stroke="#1e293b" stroke-width="1.5"/>
  <text class="s" x="500" y="431" font-size="15" text-anchor="middle" fill="#0f172a">¿Su rol está permitido en esta ruta?</text>
  <line x1="500" y1="452" x2="500" y2="498" stroke="#16a34a" stroke-width="2" marker-end="url(#arrGreen)"/>
  <text class="s" x="510" y="480" font-size="13" fill="#475569">sí</text>

  <!-- End -->
  <rect x="300" y="500" width="400" height="48" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.5"/>
  <text class="s" x="500" y="529" font-size="15" font-weight="bold" text-anchor="middle" fill="#0f172a">Se ejecuta el endpoint (200, 201, 204)</text>

  <!-- No branches -->
  <line x1="700" y1="166" x2="778" y2="166" stroke="#a16207" stroke-width="2" marker-end="url(#arrYellow)"/>
  <text class="s" x="739" y="158" font-size="13" text-anchor="middle" fill="#475569">no</text>
  <rect x="780" y="144" width="148" height="44" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text class="s" x="854" y="172" font-size="18" font-weight="bold" text-anchor="middle" fill="#a16207">401</text>

  <line x1="700" y1="246" x2="778" y2="246" stroke="#a16207" stroke-width="2" marker-end="url(#arrYellow)"/>
  <text class="s" x="739" y="238" font-size="13" text-anchor="middle" fill="#475569">no</text>
  <rect x="780" y="224" width="148" height="44" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text class="s" x="854" y="252" font-size="18" font-weight="bold" text-anchor="middle" fill="#a16207">401</text>

  <line x1="700" y1="326" x2="778" y2="326" stroke="#a16207" stroke-width="2" marker-end="url(#arrYellow)"/>
  <text class="s" x="739" y="318" font-size="13" text-anchor="middle" fill="#475569">no</text>
  <rect x="780" y="304" width="148" height="44" rx="10" fill="#fef9c3" stroke="#a16207" stroke-width="1.5"/>
  <text class="s" x="854" y="332" font-size="18" font-weight="bold" text-anchor="middle" fill="#a16207">401</text>

  <line x1="700" y1="426" x2="778" y2="426" stroke="#dc2626" stroke-width="2" marker-end="url(#arrRed)"/>
  <text class="s" x="739" y="418" font-size="13" text-anchor="middle" fill="#475569">no</text>
  <rect x="780" y="404" width="148" height="44" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.5"/>
  <text class="s" x="854" y="432" font-size="18" font-weight="bold" text-anchor="middle" fill="#dc2626">403</text>
</svg>
